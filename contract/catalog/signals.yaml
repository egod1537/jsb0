contract_version: 2.0.0
telemetry_schema_version: 1

topics:
  /jsb/primary/aircraft/state:
    message: jsb.telemetry.v1.AircraftState
    source: primary
  /jsb/primary/control/roll:
    message: jsb.telemetry.v1.RollControlState
    source: primary
  /jsb/baseline/aircraft/state:
    message: jsb.telemetry.v1.AircraftState
    source: baseline
  /jsb/baseline/control/roll:
    message: jsb.telemetry.v1.RollControlState
    source: baseline
  /jsb/simulation/event:
    message: jsb.telemetry.v1.SimulationEvent
    source: runtime

signals:
  simulation.time:
    topic: /jsb/primary/aircraft/state
    field: sim_time_ns
    type: uint64
    unit: ns
    frame: simulation
    group: simulation.time
    sign: increasing
    convention: monotonic simulation-relative time; not Unix time
    description: Authoritative simulation-relative timestamp for the sample.
    required: true
    range: [0, null]
  aircraft.roll:
    topic: /jsb/primary/aircraft/state
    field: roll_rad
    type: float64
    unit: rad
    frame: body
    group: aircraft.attitude
    sign: right-hand positive about body +X
    convention: 3-2-1 Euler roll; right-hand positive about body +X
    description: Measured aircraft roll Euler angle.
    required: true
  aircraft.roll_rate:
    topic: /jsb/primary/aircraft/state
    field: roll_rate_rad_s
    type: float64
    unit: rad/s
    frame: body
    axis: x
    group: aircraft.angular_rate
    sign: right-hand positive about body +X
    convention: body-axis p; right-hand positive about body +X
    description: Measured body-axis roll rate p.
    required: true
  control.commanded_roll:
    topic: /jsb/primary/control/roll
    field: commanded_roll_rad
    type: float64
    unit: rad
    frame: body
    group: control.roll
    sign: right-hand positive about body +X
    convention: desired 3-2-1 Euler roll; right-hand positive about body +X
    description: Roll angle setpoint supplied to the roll controller.
    required: true
  control.commanded_roll_rate:
    topic: /jsb/primary/control/roll
    field: commanded_roll_rate_rad_s
    type: float64
    unit: rad/s
    frame: body
    axis: x
    group: control.roll
    sign: right-hand positive about body +X
    convention: desired body-axis p; right-hand positive about body +X
    description: Body-axis roll-rate setpoint produced by the attitude loop.
    required: true
  control.roll_error:
    topic: /jsb/primary/control/roll
    field: roll_error_rad
    type: float64
    unit: rad
    frame: body
    group: control.roll
    sign: positive when command exceeds measurement
    convention: commanded_roll_rad minus measured roll_rad
    description: Signed roll angle tracking error.
    required: true
  control.roll_rate_error:
    topic: /jsb/primary/control/roll
    field: roll_rate_error_rad_s
    type: float64
    unit: rad/s
    frame: body
    axis: x
    group: control.roll
    sign: positive when command exceeds measurement
    convention: commanded_roll_rate_rad_s minus measured body p
    description: Signed body-axis roll-rate tracking error.
    required: true
  actuator.aileron:
    topic: /jsb/primary/control/roll
    field: aileron_command
    type: float64
    unit: normalized
    frame: aircraft
    group: actuator.flight_control
    sign: positive produces positive roll on C172x
    convention: positive command produces positive roll for the C172x direct input
    description: Normalized aileron command after controller limiting.
    required: true
    range: [-1, 1]
